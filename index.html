const btnsEl = document.getElementById('btns');
let selected = null;

HEROES.forEach(h=>{
  const b = document.createElement('button');
  b.className='btn';
  b.innerHTML = `<span style="position:relative;z-index:1">${h.label}</span><span class="line"></span>`;
  b.onclick = ()=>{
    selected = h.id;
    document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    window.open(LINE_URL,'_blank','noopener');
  };
  btnsEl.appendChild(b);
});

// 外部連結自動 _blank (原檔邏輯精簡版)
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a) return;
  try{
    const u=new URL(a.href,location.href);
    if((u.protocol==='http:'||u.protocol==='https:')&&u.host!==location.host){
      a.target='_blank'; a.rel='noopener noreferrer';
    }
  }catch{}
});
</script>
</body>
</html>
