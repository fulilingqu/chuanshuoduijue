*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#020b1a;color:#fff;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover;object-position:center}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(2,11,26,.2),rgba(2,11,26,.1) 40%,rgba(2,11,26,.85)),linear-gradient(to top,#020b1a 0%,transparent 60%);box-shadow:inset 0 0 200px rgba(0,0,0,.6)}
.main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 0}
.title{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:.3em;text-shadow:0 2px 20px rgba(0,0,0,.8);margin-bottom:32px;text-align:center}
.title span{color:#f5d77a}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px}
.btn{position:relative;min-width:84px;max-width:120px;padding:12px 24px;font-size:14px;font-weight:700;letter-spacing:.2em;border:1px solid #c8a44a;border-radius:8px;background:#0e2447;color:#f5d77a;cursor:pointer;transition:all .3s ease-out;box-shadow:0 4px 20px rgba(0,0,0,.6),0 0 0 1px rgba(200,164,74,.15)}
@media(min-width:640px){.btn{min-width:112px}}
.btn::before{content:"";position:absolute;inset:1px;border-radius:7px;background:linear-gradient(to bottom,rgba(255,255,255,.08),transparent);opacity:.6;transition:opacity .3s;pointer-events:none}
.btn:hover{border-color:#f5d77a;background:#163368;color:#fff2b0;box-shadow:0 0 22px rgba(245,215,122,.5),0 6px 24px rgba(0,0,0,.7);transform:translateY(-1px)}
.btn:hover::before{opacity:1}
.btn.active{border-color:#fff2b0;background:#1a3a6e;color:#fff2b0;box-shadow:0 0 24px rgba(245,215,122,.6)}
.btn .line{position:absolute;left:50%;bottom:-1px;height:1px;width:0;background:#f5d77a;box-shadow:0 0 8px #f5d77a;transform:translateX(-50%);transition:width .3s}
.btn:hover .line{width:70%}
footer{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 16px 28px;overflow:hidden}
@media(min-width:640px){footer{padding-bottom:32px}}
.sep{height:1px;width:100%;max-width:520px;background:linear-gradient(to right,transparent,rgba(245,215,122,.2),transparent)}
.date{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;font-size:10px;letter-spacing:.25em;color:rgba(255,255,255,.45)}
.dot{width:1px;height:8px;background:rgba(255,255,255,.2)}
.tag{margin-left:8px;padding:2px 8px;border:1px solid rgba(245,215,122,.2);background:rgba(245,215,122,.1);border-radius:4px;font-size:9px;letter-spacing:.2em;color:rgba(245,215,122,.7)}
.copy{font-size:9px;line-height:1.6;letter-spacing:.05em;color:rgba(255,255,255,.25);text-align:center}
.bottom-glow{position:fixed;left:0;right:0;bottom:0;height:300px;pointer-events:none;background:linear-gradient(to top,rgba(30,92,199,.15),rgba(30,92,199,.05) 50%,transparent);z-index:0}
